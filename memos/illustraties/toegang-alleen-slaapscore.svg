<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 306" width="840" height="306" role="img" aria-label="Toegang op maat: met een scope voor de slaapscore laat de FHIR API alleen de slaapscore door; hartslag en gewicht blijven in de kluis">
<title>Toegang op maat: met een scope voor de slaapscore laat de FHIR API alleen de slaapscore door; hartslag en gewicht blijven in de kluis</title>
<style>
svg{font-family:Helvetica,Arial,sans-serif;font-size:13.5px;fill:#212529}
.t{font-size:15px;font-weight:700}
.s{font-size:12px;fill:#495057}
.e{font-size:11px;font-weight:700;letter-spacing:1.3px;fill:#868e96}
.b{font-weight:700}
.m{font-family:Menlo,Consolas,'Courier New',monospace;font-size:11.5px}
.c{text-anchor:middle}
.r{text-anchor:end}
.cw{fill:#fff}
.cb{fill:#1864ab}
.cg{fill:#2b8a3e}
.cv{fill:#5f3dc4}
.ca{fill:#d9480f}
.cr{fill:#c92a2a}
.cm{fill:#868e96}
.ic{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ln{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0.8L9.5 5L0 9.2z" fill="#2f9e44"/></marker>
<symbol id="i-app" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10.5 18.5h3"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L20 3M16.5 6.5l3 3M13.5 9.5l2.5 2.5"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></symbol>
<symbol id="i-scale" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M8 9.5a5.5 5.5 0 0 1 8 0M12 12l1.6-3.2"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8.3 8.3 0 1 1 9.8 4a6.6 6.6 0 0 0 10.2 10.2z"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="i-cross" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
</defs>
<rect width="840" height="306" rx="12" fill="#fff"/>
<!-- kluis -->
<rect x="9" y="52" width="10" height="30" rx="3" fill="#343a40"/><rect x="9" y="182" width="10" height="30" rx="3" fill="#343a40"/>
<rect x="16" y="16" width="296" height="232" rx="14" fill="#fff" stroke="#343a40" stroke-width="2.5"/>
<use href="#i-lock" x="30" y="27" width="26" height="26" class="ic" stroke="#343a40"/>
<text x="66" y="42" class="t">Persoonlijke gegevenskluis</text>
<text x="66" y="59" class="s">metingen van de burger</text>
<g stroke-width="1.3">
<rect x="30" y="78" width="268" height="44" rx="10" fill="#f8f9fa" stroke="#ced4da"/><rect x="30" y="130" width="268" height="44" rx="10" fill="#f8f9fa" stroke="#ced4da"/><rect x="30" y="182" width="268" height="44" rx="10" fill="#ebfbee" stroke="#8ce99a"/>
</g>
<g class="ic">
<use href="#i-heart" x="40" y="88" width="24" height="24" stroke="#868e96"/><use href="#i-scale" x="40" y="140" width="24" height="24" stroke="#868e96"/><use href="#i-moon" x="40" y="192" width="24" height="24" stroke="#2f9e44"/>
</g>
<text x="76" y="105">Hartslag</text><text x="76" y="157">Gewicht</text><text x="76" y="209">Slaapscore</text>
<text x="286" y="104.5" class="s r cm">blijft in de kluis</text><text x="286" y="156.5" class="s r cm">blijft in de kluis</text><text x="286" y="208.5" class="s r cg">gedeeld</text>
<!-- scope -->
<path d="M420 74V84" class="ln" stroke="#1971c2" stroke-width="1.5"/>
<rect x="322" y="16" width="196" height="58" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
<use href="#i-key" x="332" y="23" width="20" height="20" class="ic" stroke="#1971c2"/>
<text x="357" y="37" class="s b cb">scope in het access_token</text>
<text x="420" y="53" class="m c">patient/Observation.rs</text>
<text x="420" y="67" class="m c">?code=…|sleepscore</text>
<!-- api als filter -->
<rect x="396" y="84" width="48" height="164" rx="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
<g class="ln" stroke="#adb5bd" stroke-width="2"><path d="M320 100H376"/><path d="M320 152H376"/></g>
<g class="ic" stroke="#e03131" stroke-width="2.2">
<use href="#i-cross" x="372" y="90" width="20" height="20"/><use href="#i-cross" x="372" y="142" width="20" height="20"/>
</g>
<text transform="rotate(-90 420 143)" x="420" y="147.5" class="s b c cg">FHIR API</text>
<path d="M320 204H520" class="ln" stroke="#2f9e44" stroke-width="2" marker-end="url(#a-green)"/>
<!-- app -->
<rect x="528" y="16" width="296" height="232" rx="14" fill="#fff9db" stroke="#f08c00" stroke-width="1.5"/>
<use href="#i-app" x="542" y="28" width="26" height="26" class="ic" stroke="#d9480f"/>
<text x="578" y="42" class="t">Coach-app</text>
<text x="578" y="59" class="s">ziet alleen de slaapscore</text>
<g fill="none" stroke="#ffd8a8" stroke-width="1.3" stroke-dasharray="5 5">
<rect x="542" y="78" width="268" height="44" rx="10"/><rect x="542" y="130" width="268" height="44" rx="10"/>
</g>
<text x="676" y="104.5" class="s c cm">niet gedeeld</text><text x="676" y="156.5" class="s c cm">niet gedeeld</text>
<rect x="542" y="182" width="268" height="44" rx="10" fill="#ebfbee" stroke="#8ce99a" stroke-width="1.3"/>
<use href="#i-moon" x="552" y="192" width="24" height="24" class="ic" stroke="#2f9e44"/>
<text x="588" y="209">Slaapscore</text>
<use href="#i-check" x="776" y="193" width="22" height="22" class="ic" stroke="#2f9e44" stroke-width="2.2"/>
<!-- noot -->
<text x="420" y="282" class="s c">Hartslag en gewicht verlaten de kluis niet. Nieuwe slaapscores vallen onder dezelfde toestemming.</text>
</svg>
