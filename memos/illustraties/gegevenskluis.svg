<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 474" width="840" height="474" role="img" aria-label="De persoonlijke gegevenskluis: de burger geeft de sleutel uit (OpenID Connect met SMART on FHIR-scopes), apps komen binnen via één voordeur (de FHIR API), op een fundament van openEHR en de pod">
<title>De persoonlijke gegevenskluis: de burger geeft de sleutel uit (OpenID Connect met SMART on FHIR-scopes), apps komen binnen via één voordeur (de FHIR API), op een fundament van openEHR en de pod</title>
<style>
svg{font-family:Helvetica,Arial,sans-serif;font-size:13.5px;fill:#212529}
.t{font-size:15px;font-weight:700}
.s{font-size:12px;fill:#495057}
.e{font-size:11px;font-weight:700;letter-spacing:1.3px;fill:#868e96}
.b{font-weight:700}
.m{font-family:Menlo,Consolas,'Courier New',monospace;font-size:11.5px}
.c{text-anchor:middle}
.r{text-anchor:end}
.cw{fill:#fff}
.cb{fill:#1864ab}
.cg{fill:#2b8a3e}
.cv{fill:#5f3dc4}
.ca{fill:#d9480f}
.cr{fill:#c92a2a}
.cm{fill:#868e96}
.ic{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ln{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0.8L9.5 5L0 9.2z" fill="#495057"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0.8L9.5 5L0 9.2z" fill="#f08c00"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0.8L9.5 5L0 9.2z" fill="#1971c2"/></marker>
<symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>
<symbol id="i-app" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10.5 18.5h3"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L20 3M16.5 6.5l3 3M13.5 9.5l2.5 2.5"/></symbol>
<symbol id="i-door" viewBox="0 0 24 24"><path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M3 21h18"/><circle cx="14.5" cy="12.5" r="0.9"/></symbol>
<symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
</defs>
<rect width="840" height="474" rx="12" fill="#fff"/>
<!-- burger -->
<rect x="20" y="20" width="214" height="64" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
<use href="#i-person" x="33" y="37" width="30" height="30" class="ic" stroke="#1971c2"/>
<text x="74" y="47" class="t">Burger</text>
<text x="74" y="65" class="s">DigiD of GIDS private ID</text>
<!-- apps -->
<g fill="#fff9db" stroke="#f08c00" stroke-width="1.5">
<rect x="318" y="20" width="162" height="64" rx="12"/><rect x="488" y="20" width="162" height="64" rx="12"/><rect x="658" y="20" width="162" height="64" rx="12"/>
</g>
<g class="ic" stroke="#d9480f">
<use href="#i-app" x="327" y="39" width="26" height="26"/><use href="#i-app" x="497" y="39" width="26" height="26"/><use href="#i-app" x="667" y="39" width="26" height="26"/>
</g>
<text x="359" y="48" class="b">Gezondheidsgids</text><text x="529" y="48" class="b">Wearable-app</text><text x="699" y="48" class="b">Andere app</text>
<g class="s">
<text x="359" y="65">spreekt alleen FHIR</text><text x="529" y="65">spreekt alleen FHIR</text><text x="699" y="65">spreekt alleen FHIR</text>
</g>
<!-- kluis -->
<rect x="72" y="420" width="64" height="10" rx="3" fill="#343a40"/><rect x="704" y="420" width="64" height="10" rx="3" fill="#343a40"/>
<rect x="12" y="188" width="11" height="36" rx="3" fill="#343a40"/><rect x="12" y="346" width="11" height="36" rx="3" fill="#343a40"/>
<rect x="20" y="150" width="800" height="270" rx="20" fill="#fff" stroke="#343a40" stroke-width="3"/>
<!-- a: de sleutel -->
<rect x="44" y="178" width="300" height="118" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
<use href="#i-key" x="58" y="191" width="40" height="40" class="ic" stroke="#1971c2" stroke-width="1.4"/>
<text x="110" y="208" class="t cb">a) De sleutel</text>
<text x="110" y="227">OpenID Connect met</text>
<text x="110" y="244">SMART on FHIR-scopes</text>
<text x="60" y="277" class="s">De burger bepaalt wie wat mag zien</text>
<!-- b: de voordeur -->
<rect x="364" y="178" width="432" height="118" rx="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
<use href="#i-door" x="378" y="191" width="40" height="40" class="ic" stroke="#2f9e44" stroke-width="1.4"/>
<text x="430" y="208" class="t cg">b) De voordeur</text>
<text x="430" y="227">FHIR API volgens de WellData IG,</text>
<text x="430" y="244">in lijn met de FAIR-principes</text>
<text x="380" y="277" class="s">Eén standaardinterface: elke FHIR-app kan aansluiten</text>
<!-- c: het fundament -->
<rect x="44" y="326" width="752" height="70" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/>
<use href="#i-db" x="58" y="341" width="40" height="40" class="ic" stroke="#7048e8" stroke-width="1.4"/>
<text x="110" y="357" class="t cv">c) Het fundament</text>
<text x="110" y="376">Backend met openEHR en de pod*</text>
<text x="780" y="366" class="s r">Duurzaam bewaard, met versiebeheer en controleerbaar</text>
<path d="M569 296V321" class="ln" stroke="#495057" marker-end="url(#a-gray)"/>
<!-- naamplaat -->
<rect x="250" y="406" width="340" height="28" rx="14" fill="#343a40"/>
<text x="420" y="424.5" class="s b c cw">Persoonlijke gegevenskluis van een kluisaanbieder</text>
<!-- pijlen -->
<path d="M70 84V173" class="ln" stroke="#1971c2" stroke-width="2" marker-end="url(#a-blue)"/>
<text x="82" y="122" class="s">geeft toestemming</text>
<path d="M288 178C288 118 276 52 313 52" class="ln" stroke="#1971c2" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-blue)"/>
<text x="274" y="122" class="s r cb">sleutel op maat</text>
<g class="ln" stroke="#f08c00" stroke-width="2">
<path d="M399 84V173" marker-end="url(#a-amber)"/><path d="M569 84V173" marker-end="url(#a-amber)"/><path d="M739 84V173" marker-end="url(#a-amber)"/>
</g>
<rect x="543" y="111" width="52" height="22" rx="11" fill="#fff"/>
<text x="569" y="126.3" class="s b c cg">FHIR</text>
<text x="20" y="458" class="s cm">*) Andere implementaties van de backend zijn mogelijk.</text>
</svg>
