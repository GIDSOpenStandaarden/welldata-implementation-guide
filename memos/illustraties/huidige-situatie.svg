<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500" role="img" aria-label="Huidige situatie: elke app leest en schrijft zelf FHIR als RDF-bestanden in de Solid pod van de burger, met toegang via Access Grants">
<title>Huidige situatie: elke app leest en schrijft zelf FHIR als RDF-bestanden in de Solid pod van de burger, met toegang via Access Grants</title>
<style>
svg{font-family:Helvetica,Arial,sans-serif;font-size:13.5px;fill:#212529}
.t{font-size:15px;font-weight:700}
.s{font-size:12px;fill:#495057}
.e{font-size:11px;font-weight:700;letter-spacing:1.3px;fill:#868e96}
.b{font-weight:700}
.m{font-family:Menlo,Consolas,'Courier New',monospace;font-size:11.5px}
.c{text-anchor:middle}
.r{text-anchor:end}
.cw{fill:#fff}
.cb{fill:#1864ab}
.cg{fill:#2b8a3e}
.cv{fill:#5f3dc4}
.ca{fill:#d9480f}
.cr{fill:#c92a2a}
.cm{fill:#868e96}
.ic{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ln{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0.8L9.5 5L0 9.2z" fill="#495057"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0.8L9.5 5L0 9.2z" fill="#f08c00"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0.8L9.5 5L0 9.2z" fill="#1971c2"/></marker>
<symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>
<symbol id="i-app" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10.5 18.5h3"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M2 7a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L20 3M16.5 6.5l3 3M13.5 9.5l2.5 2.5"/></symbol>
<symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
<symbol id="i-file" viewBox="0 0 16 22"><path d="M0.8 0.8h9.7l4.7 4.7v15.7H0.8z"/><path d="M10.5 0.8v4.7h4.7" fill="none"/></symbol>
</defs>
<rect width="840" height="500" rx="12" fill="#fff"/>
<!-- burger -->
<rect x="20" y="20" width="220" height="100" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
<use href="#i-person" x="34" y="31" width="30" height="30" class="ic" stroke="#1971c2"/>
<text x="74" y="45" class="t">Burger</text>
<text x="74" y="62" class="s">met een eigen WebID</text>
<text x="36" y="90" class="s">Logt in met de GIDS anonieme ID</text>
<text x="36" y="106" class="s">of met ACM/itsme</text>
<path d="M70 120V171" class="ln" stroke="#1971c2" marker-end="url(#a-blue)"/>
<text x="82" y="151" class="s">geeft toestemming</text>
<!-- toegang -->
<rect x="20" y="176" width="220" height="222" rx="12" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5"/>
<use href="#i-key" x="34" y="188" width="26" height="26" class="ic" stroke="#495057"/>
<text x="70" y="202" class="t">Toegang per app</text>
<text x="70" y="218" class="s">Inrupt ESS, via We Are</text>
<path d="M46 262V280M46 304V316M46 340V358" class="ln" stroke="#ced4da"/>
<g fill="#fff" stroke="#868e96" stroke-width="1.4">
<circle cx="46" cy="250" r="10.5"/><circle cx="46" cy="292" r="10.5"/><circle cx="46" cy="328" r="10.5"/><circle cx="46" cy="370" r="10.5"/>
</g>
<text x="46" y="254.3" class="s b c">1</text><text x="46" y="296.3" class="s b c">2</text><text x="46" y="332.3" class="s b c">3</text><text x="46" y="374.3" class="s b c">4</text>
<text x="68" y="247">Access Request</text><text x="68" y="262" class="s">verifiable credential</text>
<text x="68" y="296.5">Toestemming in We Are</text>
<text x="68" y="325">Access Grant</text><text x="68" y="340" class="s">verifiable credential</text>
<text x="68" y="374.5">UMA-token voor de pod</text>
<!-- launch -->
<rect x="20" y="414" width="220" height="66" rx="12" fill="#fff" stroke="#dee2e6" stroke-width="1.5"/>
<text x="36" y="443" class="b">Launch tussen apps</text>
<text x="36" y="461" class="s">via HTI 2.0</text>
<!-- apps -->
<g fill="#fff9db" stroke="#f08c00" stroke-width="1.5">
<rect x="290" y="20" width="166" height="112" rx="12"/><rect x="472" y="20" width="166" height="112" rx="12"/><rect x="654" y="20" width="166" height="112" rx="12"/>
</g>
<g class="ic" stroke="#d9480f">
<use href="#i-app" x="300" y="29" width="26" height="26"/><use href="#i-app" x="482" y="29" width="26" height="26"/><use href="#i-app" x="664" y="29" width="26" height="26"/>
</g>
<text x="332" y="47" class="b">Gezondheidsgids</text><text x="514" y="47" class="b">Wearable-app</text><text x="696" y="47" class="b">Andere app</text>
<g fill="#fff" stroke="#ffd43b" stroke-width="1.2">
<rect x="302" y="64" width="142" height="24" rx="12"/><rect x="302" y="96" width="142" height="24" rx="12"/>
<rect x="484" y="64" width="142" height="24" rx="12"/><rect x="484" y="96" width="142" height="24" rx="12"/>
<rect x="666" y="64" width="142" height="24" rx="12"/><rect x="666" y="96" width="142" height="24" rx="12"/>
</g>
<g class="s c">
<text x="373" y="80.3">eigen Solid-client</text><text x="373" y="112.3">eigen RDF-conversie</text>
<text x="555" y="80.3">eigen Solid-client</text><text x="555" y="112.3">eigen RDF-conversie</text>
<text x="737" y="80.3">eigen Solid-client</text><text x="737" y="112.3">eigen RDF-conversie</text>
</g>
<!-- app vraagt toegang -->
<path d="M318 132V240Q318 250 308 250H246" class="ln" stroke="#868e96" marker-end="url(#a-gray)"/>
<text x="252" y="268" class="s">vraagt toegang</text>
<!-- apps naar pod -->
<g class="ln" stroke="#f08c00" stroke-width="2">
<path d="M373 132V294" marker-end="url(#a-amber)"/><path d="M555 132V294" marker-end="url(#a-amber)"/><path d="M737 132V294" marker-end="url(#a-amber)"/>
</g>
<rect x="452" y="200" width="206" height="24" rx="12" fill="#fff"/>
<text x="555" y="216.3" class="s c">leest en schrijft zelf .ttl-bestanden</text>
<!-- pod -->
<rect x="290" y="300" width="530" height="180" rx="14" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/>
<use href="#i-db" x="304" y="311" width="28" height="28" class="ic" stroke="#7048e8"/>
<text x="342" y="327" class="t">Solid pod van de burger</text>
<text x="342" y="344" class="s">FHIR als RDF (Turtle), elke resource een eigen bestand</text>
<g fill="#fff" stroke="#b197fc" stroke-width="1.3">
<rect x="306" y="360" width="122" height="104" rx="10"/><rect x="440" y="360" width="150" height="104" rx="10"/><rect x="602" y="360" width="202" height="104" rx="10"/>
</g>
<g class="ic" stroke="#7048e8">
<use href="#i-folder" x="316" y="368" width="20" height="20"/><use href="#i-folder" x="450" y="368" width="20" height="20"/><use href="#i-folder" x="612" y="368" width="20" height="20"/>
</g>
<g class="s b cv">
<text x="342" y="383">Patient/</text><text x="476" y="383">Observation/</text><text x="638" y="383">QuestionnaireResponse/</text>
</g>
<g fill="#f3f0ff" stroke="#9775fa" stroke-width="1.2" stroke-linejoin="round">
<use href="#i-file" x="318" y="400" width="16" height="22"/>
<use href="#i-file" x="452" y="400" width="16" height="22"/><use href="#i-file" x="466" y="400" width="16" height="22"/><use href="#i-file" x="480" y="400" width="16" height="22"/><use href="#i-file" x="494" y="400" width="16" height="22"/><use href="#i-file" x="508" y="400" width="16" height="22"/><use href="#i-file" x="522" y="400" width="16" height="22"/><use href="#i-file" x="536" y="400" width="16" height="22"/><use href="#i-file" x="550" y="400" width="16" height="22"/>
<use href="#i-file" x="614" y="400" width="16" height="22"/><use href="#i-file" x="634" y="400" width="16" height="22"/><use href="#i-file" x="654" y="400" width="16" height="22"/>
</g>
<g class="s">
<text x="318" y="447">één bestand</text><text x="452" y="447">honderden bestanden</text><text x="614" y="447">een bestand per ingevulde lijst</text>
