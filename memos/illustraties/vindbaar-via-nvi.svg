<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 296" width="840" height="296" role="img" aria-label="Vindbaar via de NVI: de kluis publiceert het FHIR-endpoint in de NVI, een onderzoeker zoekt daar waar gegevens staan en vraagt bij de kluis een access_token aan">
<title>Vindbaar via de NVI: de kluis publiceert het FHIR-endpoint in de NVI, een onderzoeker zoekt daar waar gegevens staan en vraagt bij de kluis een access_token aan</title>
<style>
svg{font-family:Helvetica,Arial,sans-serif;font-size:13.5px;fill:#212529}
.t{font-size:15px;font-weight:700}
.s{font-size:12px;fill:#495057}
.e{font-size:11px;font-weight:700;letter-spacing:1.3px;fill:#868e96}
.b{font-weight:700}
.m{font-family:Menlo,Consolas,'Courier New',monospace;font-size:11.5px}
.c{text-anchor:middle}
.r{text-anchor:end}
.cw{fill:#fff}
.cb{fill:#1864ab}
.cg{fill:#2b8a3e}
.cv{fill:#5f3dc4}
.ca{fill:#d9480f}
.cr{fill:#c92a2a}
.cm{fill:#868e96}
.ic{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ln{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0.8L9.5 5L0 9.2z" fill="#495057"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0.8L9.5 5L0 9.2z" fill="#1971c2"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0.8L9.5 5L0 9.2z" fill="#2f9e44"/></marker>
<marker id="a-light" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0.8L9.5 5L0 9.2z" fill="#adb5bd"/></marker>
<symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6.5L4.8 19a1.4 1.4 0 0 0 1.2 2h12a1.4 1.4 0 0 0 1.2-2L14 9.5V3M7.5 15h9"/></symbol>
<symbol id="i-sign" viewBox="0 0 24 24"><path d="M12 3v18M12 5h6.5l2 2.5-2 2.5H12zM12 12H5.5l-2 2.5 2 2.5H12z"/></symbol>
</defs>
<rect width="840" height="296" rx="12" fill="#fff"/>
<!-- onderzoeker -->
<rect x="20" y="118" width="190" height="84" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
<use href="#i-flask" x="32" y="131" width="28" height="28" class="ic" stroke="#495057"/>
<text x="70" y="148" class="t">Onderzoeker</text>
<text x="70" y="166" class="s">of toegangsorgaan</text><text x="70" y="181" class="s">(EHDS)</text>
<!-- nvi -->
<rect x="300" y="20" width="224" height="76" rx="12" fill="#fff4e6" stroke="#fd7e14" stroke-width="1.5"/>
<use href="#i-sign" x="312" y="33" width="28" height="28" class="ic" stroke="#e8590c"/>
<text x="350" y="49" class="t">NVI</text>
<text x="350" y="67" class="s">Nationale Verwijsindex:</text><text x="350" y="82" class="s">weet waar gegevens staan</text>
<!-- kluis -->
<rect x="590" y="24" width="230" height="212" rx="18" fill="#fff" stroke="#343a40" stroke-width="2.5"/>
<rect x="606" y="11" width="198" height="26" rx="13" fill="#343a40"/>
<text x="705" y="28.5" class="s b c cw">Persoonlijke gegevenskluis</text>
<rect x="606" y="58" width="198" height="78" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="620" y="81" class="b cb">Autorisatieservice</text>
<text x="620" y="100" class="s">veronderstelde toestemming,</text><text x="620" y="115" class="s">tenzij opt-out</text>
<rect x="606" y="146" width="198" height="72" rx="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
<text x="620" y="169" class="b cg">FHIR API</text>
<text x="620" y="188" class="s">levert alleen gegevens</text><text x="620" y="203" class="s">binnen de scopes</text>
<!-- publiceren -->
<path d="M590 46H530" class="ln" stroke="#adb5bd" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a-light)"/>
<text x="558" y="68" class="s c cm">publiceert</text><text x="558" y="83" class="s c cm">endpoint</text>
<!-- 1 zoeken -->
<path d="M80 118V56Q80 46 90 46H295" class="ln" stroke="#495057" stroke-width="2" marker-end="url(#a-gray)"/>
<circle cx="104" cy="30" r="9.5" fill="#495057"/><text x="104" y="34.3" class="s b c cw">1</text>
<text x="120" y="34.3" class="s">zoekt waar gegevens staan</text>
<!-- 2 verwijzing -->
<path d="M300 78H152Q142 78 142 88V113" class="ln" stroke="#495057" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-gray)"/>
<circle cx="166" cy="96" r="9.5" fill="#495057"/><text x="166" y="100.3" class="s b c cw">2</text>
<text x="182" y="100.3" class="s">verwijst naar de kluis</text>
<!-- 3 access_token -->
<path d="M210 130H601" class="ln" stroke="#1971c2" stroke-width="2" marker-end="url(#a-blue)"/>
<circle cx="336" cy="130" r="9.5" fill="#1971c2"/><text x="336" y="134.3" class="s b c cw">3</text>
<rect x="350" y="120" width="170" height="20" fill="#fff"/>
<text x="354" y="134.3" class="s">vraagt een access_token aan</text>
<!-- 4 fhir -->
<path d="M210 182H601" class="ln" stroke="#2f9e44" stroke-width="2" marker-end="url(#a-green)"/>
<circle cx="336" cy="182" r="9.5" fill="#2f9e44"/><text x="336" y="186.3" class="s b c cw">4</text>
<rect x="350" y="172" width="192" height="20" fill="#fff"/>
<text x="354" y="186.3" class="s">FHIR-verzoek met access_token</text>
<!-- noot -->
<text x="20" y="272" class="s cm">Schets. De NVI is nog in consultatie; of ze past bij kluisaanbieders is een open vraag.</text>
</svg>
